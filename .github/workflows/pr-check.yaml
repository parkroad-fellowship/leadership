name: Analysis Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ github.actor != 'dependabot[bot]' && !contains(github.event.head_commit.author.name, 'dependabot') }}
    name: "Format & Analyze"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Flutter Setup & Analysis
        uses: ./.github/actions/flutter-setup

      - name: Architecture Guardrails
        run: make arch-check

      - name: Codegen Drift Check
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --exit-code -- '*.freezed.dart' '*.g.dart' '*.gr.dart'; then
            echo "::error::Generated files are out of date. Run 'make gen' and commit the result."
            exit 1
          fi
