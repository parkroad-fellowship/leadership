name: Release to production

on:
  push:
    branches:
      - main

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      aab_path: ${{ steps.save_aab_path.outputs.aab_path }}

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "adopt"

      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3
          cache: true

      - name: 📦 Install Dependencies
        run: flutter packages get

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed lib test

      - name: ⚙️ Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🕵️ Analyse
        run: flutter analyze lib

      - name: 📦 Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: ⚙️ Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: key.jks
          encodedString: ${{ secrets.RELEASE_KEYSTORE }}

      - name: 🔐 Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}" >> android/key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEYSTORE_ALIAS }}" >> android/key.properties

      - name: ⚙️ Build AAB
        run: flutter build appbundle --flavor production --target lib/main_production.dart --obfuscate --split-debug-info=debug-symbols

      - name: 📦 Upload debug symbols artifact
        uses: actions/upload-artifact@v6
        with:
          name: debug-symbols
          path: debug-symbols/
          retention-days: 1
        continue-on-error: true

      - name: 📦 Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-production-release
          path: build/app/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 1

      - name: 💾 Save AAB path
        id: save_aab_path
        run: echo "aab_path=build/app/outputs/bundle/productionRelease/app-production-release.aab" >> $GITHUB_OUTPUT

  upload_debug_symbols:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true # Don't fail the entire workflow if this job fails

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      - name: ⬇️ Download debug symbols artifact
        uses: actions/download-artifact@v7
        with:
          name: debug-symbols
          path: debug-symbols/

      - name: 📦 Prepare debug symbols
        run: |
          if [ -d "debug-symbols" ]; then
            echo "Debug symbols found, creating archive..."
            zip -r debug-symbols.zip debug-symbols
            ls -lh debug-symbols.zip
            echo "Contents:"
            unzip -l debug-symbols.zip
          else
            echo "Warning: debug-symbols directory not found"
            exit 1
          fi
        continue-on-error: true

      - name: 🔧 Setup Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash
          firebase --version
        continue-on-error: true

      - name: 🔐 Setup Firebase credentials
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > $HOME/firebase-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV
        continue-on-error: true

      - name: ⚙️ Upload debug symbols to Firebase Crashlytics
        run: |
          max_attempts=3
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Upload attempt $attempt of $max_attempts..."
            
            if firebase crashlytics:symbols:upload \
              --app=${{ secrets.FIREBASE_PROD_APP_ID }} \
              debug-symbols.zip; then
              echo "✅ Debug symbols uploaded successfully!"
              exit 0
            else
              echo "❌ Upload failed on attempt $attempt"
              if [ $attempt -lt $max_attempts ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
            
            attempt=$((attempt + 1))
          done

          echo "❌ Failed to upload debug symbols after $max_attempts attempts"
          exit 1
        continue-on-error: true

      - name: 🧹 Cleanup Firebase credentials
        if: always()
        run: |
          rm -f $HOME/firebase-service-account.json

      - name: Status
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: https://hooks.slack.com/services/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
          SLACK_TITLE: "Debug Symbols Upload Failed"
          SLACK_MESSAGE: "Failed to upload debug symbols to Firebase Crashlytics"
          SLACK_COLOR: warning


  release_google_play:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      - name: ⬇️ Download AAB artifact
        uses: actions/download-artifact@v7
        with:
          name: app-production-release
          path: build/app/outputs/bundle/productionRelease/

      - name: ⚙️ Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: ⚙️ Download bundle dependencies
        run: bundle install

      - name: 🚀 Release to Google Play (Production)
        env:
          SUPPLY_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        run: |
          bundle exec fastlane supply \
          --aab build/app/outputs/bundle/productionRelease/app-production-release.aab \
          --track production

